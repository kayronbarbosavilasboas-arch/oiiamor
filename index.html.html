    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                /*
                ========================================
                ELEMENTOS DO CONTADOR
                ========================================
                */

                const valor1 =
                    document.getElementById("valor1");

                const valor2 =
                    document.getElementById("valor2");

                const valor3 =
                    document.getElementById("valor3");

                const valor4 =
                    document.getElementById("valor4");


                const texto1 =
                    document.getElementById("texto1");

                const texto2 =
                    document.getElementById("texto2");

                const texto3 =
                    document.getElementById("texto3");

                const texto4 =
                    document.getElementById("texto4");


                /*
                ========================================
                BOTÕES
                ========================================
                */

                const botaoNormal =
                    document.getElementById(
                        "botaoNormal"
                    );

                const botaoSemanas =
                    document.getElementById(
                        "botaoSemanas"
                    );

                const botaoMeses =
                    document.getElementById(
                        "botaoMeses"
                    );


                /*
                ========================================
                DATA INICIAL
                ========================================
                */

                const dataInicial =
                    new Date(
                        2026,
                        8,
                        6,
                        0,
                        0,
                        0
                    );


                /*
                ========================================
                MODO ATUAL
                ========================================
                */

                let modoAtual =
                    "dias";


                /*
                ========================================
                ALTERAR BOTÃO ATIVO
                ========================================
                */

                function atualizarBotaoAtivo() {

                    botaoNormal
                        .classList
                        .remove("ativo");

                    botaoSemanas
                        .classList
                        .remove("ativo");

                    botaoMeses
                        .classList
                        .remove("ativo");


                    if (modoAtual === "dias") {

                        botaoNormal
                            .classList
                            .add("ativo");

                    }


                    if (modoAtual === "semanas") {

                        botaoSemanas
                            .classList
                            .add("ativo");

                    }


                    if (modoAtual === "meses") {

                        botaoMeses
                            .classList
                            .add("ativo");

                    }

                }


                /*
                ========================================
                CALCULAR TEMPO
                ========================================
                */

                function obterTempo() {

                    const agora =
                        new Date();


                    const diferenca =
                        agora.getTime()
                        -
                        dataInicial.getTime();


                    if (diferenca < 0) {

                        return {
                            dias: 0,
                            horas: 0,
                            minutos: 0,
                            segundos: 0
                        };

                    }


                    const totalSegundos =
                        Math.floor(
                            diferenca / 1000
                        );


                    const dias =
                        Math.floor(
                            totalSegundos
                            / 86400
                        );


                    const horas =
                        Math.floor(
                            (
                                totalSegundos
                                % 86400
                            )
                            / 3600
                        );


                    const minutos =
                        Math.floor(
                            (
                                totalSegundos
                                % 3600
                            )
                            / 60
                        );


                    const segundos =
                        totalSegundos
                        % 60;


                    return {
                        dias,
                        horas,
                        minutos,
                        segundos
                    };

                }


                /*
                ========================================
                ATUALIZAR CONTADOR
                ========================================
                */

                function atualizarContador() {

                    const tempo =
                        obterTempo();


                    /*
                    ------------------------------------
                    MODO NORMAL
                    ------------------------------------
                    */

                    if (modoAtual === "dias") {

                        valor1.textContent =
                            tempo.dias;

                        texto1.textContent =
                            tempo.dias === 1
                                ? "Dia"
                                : "Dias";


                        valor2.textContent =
                            String(
                                tempo.horas
                            )
                            .padStart(
                                2,
                                "0"
                            );

                        texto2.textContent =
