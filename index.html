<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kayron & Jyovânia </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 28px 14px 40px;

            font-family: Arial, Helvetica, sans-serif;

            color: white;
            text-align: center;

            background:
                radial-gradient(
                    circle at 15% 5%,
                    rgba(255, 65, 125, 0.25),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(255, 20, 100, 0.16),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0b0004,
                    #22000d 50%,
                    #090003
                );

            overflow-x: hidden;

            position: relative;
        }

        /*
        ============================================
        CORAÇÕES DE FUNDO
        ============================================
        */

        .coracoes {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;
            overflow: hidden;

            z-index: 0;
        }

        .coracao {
            position: absolute;

            bottom: -60px;

            color: rgba(255, 125, 165, 0.48);

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(255, 70, 130, 0.25)
                );

            animation:
                subirCoracao linear infinite;

            user-select: none;
        }

        @keyframes subirCoracao {

            0% {
                transform:
                    translateY(0)
                    translateX(0)
                    scale(0.8);

                opacity: 0;
            }

            10% {
                opacity: 0.6;
            }

            50% {
                transform:
                    translateY(-50vh)
                    translateX(14px)
                    scale(1);
            }

            100% {
                transform:
                    translateY(-115vh)
                    translateX(-12px)
                    scale(1.1);

                opacity: 0;
            }
        }


        /*
        ============================================
        CONTAINER PRINCIPAL
        ============================================
        */

        .container {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 820px;

            margin: 0 auto;

            padding: 34px 22px;

            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.02)
                );

            border:
                1px solid
                rgba(255, 145, 180, 0.12);

            backdrop-filter: blur(10px);

            box-shadow:
                0 20px 45px
                rgba(0, 0, 0, 0.34),
                0 0 35px
                rgba(255, 20, 90, 0.05);
        }

        h1 {
            font-size: clamp(29px, 5vw, 44px);

            line-height: 1.2;

            margin-bottom: 8px;

            color: #ffd4df;

            text-shadow:
                0 0 12px
                rgba(255, 70, 130, 0.28);
        }

        .subtitulo {
            font-size: clamp(16px, 2.8vw, 20px);

            margin-bottom: 25px;

            color: #f3d9e1;
        }


        /*
        ============================================
        CONTADOR
        ============================================
        */

        .contador {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 12px;
        }

        .caixa {
            position: relative;

            width: 100%;

            min-width: 0;

            padding: 20px 8px;

            border-radius: 17px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 95, 145, 0.105),
                    rgba(255, 255, 255, 0.03)
                );

            border:
                1px solid
                rgba(255, 160, 195, 0.12);

            box-shadow:
                0 8px 22px
                rgba(0, 0, 0, 0.18);

            overflow: hidden;
        }

        .caixa::before {
            content: "";

            position: absolute;

            top: -50%;
            left: -45%;

            width: 75%;
            height: 190%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.06),
                    transparent
                );

            transform: rotate(25deg);

            animation:
                brilho 7s ease-in-out infinite;
        }

        @keyframes brilho {

            0%,
            100% {
                transform:
                    translateX(-140%)
                    rotate(25deg);
            }

            50% {
                transform:
                    translateX(300%)
                    rotate(25deg);
            }
        }

        .numero {
            position: relative;
            z-index: 1;

            display: block;

            font-size:
                clamp(28px, 4.5vw, 41px);

            font-weight: bold;

            line-height: 1;

            color: #ffbdd0;

            text-shadow:
                0 0 8px
                rgba(255, 80, 140, 0.18);
        }

        .texto {
            position: relative;
            z-index: 1;

            margin-top: 7px;

            font-size:
                clamp(12px, 1.8vw, 15px);

            color: #f7edf0;
        }


        /*
        ============================================
        BOTÕES
        ============================================
        */

        .botoes-contador {
            margin-top: 19px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 8px;

            flex-wrap: wrap;
        }

        .botao-tempo {
            border:
                1px solid
                rgba(255, 145, 180, 0.18);

            outline: none;

            padding:
                9px 15px;

            border-radius:
                999px;

            cursor: pointer;

            font-size: 13px;
            font-weight: bold;

            color: #ffd7e2;

            background:
                rgba(255, 85, 135, 0.08);

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.15);

            transition:
                0.25s ease;
        }

        .botao-tempo:hover {
            transform:
                translateY(-2px);

            background:
                rgba(255, 90, 145, 0.15);
        }

        .botao-tempo.ativo {
            color: white;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 65, 120, 0.38),
                    rgba(155, 15, 60, 0.24)
                );

            border-color:
                rgba(255, 150, 185, 0.4);

            box-shadow:
                0 0 16px
                rgba(255, 40, 105, 0.12);
        }

        .desde {
            margin-top: 19px;

            font-size:
                clamp(13px, 2vw, 16px);

            color: #efc8d4;
        }


        /*
        ============================================
        SEÇÃO DE MÚSICAS
        ============================================
        */

        .secao-musicas {
            width: 100%;

            margin-top: 55px;

            padding-top: 32px;

            border-top:
                1px solid
                rgba(255, 145, 180, 0.10);
        }

        .titulo-musicas {
            margin-bottom: 24px;
        }

        .icone-musica {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 42px;
            height: 42px;

            margin:
                0 auto 11px;

            border-radius: 50%;

            font-size: 22px;

            color: #ffc1d2;

            background:
                rgba(255, 70, 125, 0.09);

            border:
                1px solid
                rgba(255, 145, 180, 0.14);
        }

        .titulo-musicas h2 {
            font-size:
                clamp(23px, 4vw, 31px);

            color:
                #ffd2df;

            margin-bottom:
                6px;
        }

        .titulo-musicas p {
            font-size:
                13px;

            color:
                rgba(255, 220, 230, 0.66);
        }

        .lista-musicas {
            display:
                grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap:
                14px;
        }

        .card-musica {
            padding:
                18px;

            border-radius:
                18px;

            text-align:
                left;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 85, 135, 0.075),
                    rgba(255,255,255,0.02)
                );

            border:
                1px solid
                rgba(255, 150, 185, 0.11);

            box-shadow:
                0 8px 22px
                rgba(0,0,0,0.18);
        }

        .musica-extra {
            grid-column:
                1 / -1;
        }

        .tipo-musica {
            display:
                inline-block;

            margin-bottom:
                10px;

            padding:
                5px 9px;

            border-radius:
                999px;

            font-size:
                10px;

            font-weight:
                bold;

            text-transform:
                uppercase;

            letter-spacing:
                0.35px;

            color:
                #ffc9d8;

            background:
                rgba(255, 85, 135, 0.08);

            border:
                1px solid
                rgba(255, 140, 180, 0.12);
        }

        .card-musica h3 {
            font-size:
                20px;

            margin-bottom:
                3px;

            color:
                #fff1f5;
        }

        .artista {
            margin-bottom:
                14px;

            font-size:
                13px;

            color:
                rgba(255, 220, 230, 0.60);
        }

        .spotify-player {
            width:
                100%;

            border-radius:
                14px;

            overflow:
                hidden;
        }

        .spotify-player iframe {
            display:
                block;

            width:
                100%;
        }


        /*
        ============================================
        TABLET
        ============================================
        */

        @media (max-width: 700px) {

            .container {
                max-width: 560px;

                padding:
                    28px 16px;
            }

            .contador {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap:
                    10px;
            }

            .caixa {
                padding:
                    18px 8px;
            }

            .lista-musicas {
                grid-template-columns:
                    1fr;
            }

            .musica-extra {
                grid-column:
                    auto;
            }

        }


        /*
        ============================================
        CELULAR
        ============================================
        */

        @media (max-width: 480px) {

            body {
                padding:
                    18px 10px 30px;
            }

            .container {
                width:
                    100%;

                padding:
                    23px 12px;

                border-radius:
                    20px;
            }

            h1 {
                font-size:
                    28px;

                margin-bottom:
                    6px;
            }

            .subtitulo {
                font-size:
                    15px;

                margin-bottom:
                    20px;
            }

            .contador {
                grid-template-columns:
                    repeat(2, 1fr);

                gap:
                    8px;
            }

            .caixa {
                padding:
                    15px 5px;

                border-radius:
                    14px;
            }

            .numero {
                font-size:
                    29px;
            }

            .texto {
                margin-top:
                    5px;

                font-size:
                    11px;
            }

            .botoes-contador {
                margin-top:
                    15px;

                gap:
                    6px;
            }

            .botao-tempo {
                padding:
                    8px 11px;

                font-size:
                    11px;
            }

            .desde {
                margin-top:
                    15px;

                font-size:
                    13px;
            }

            .secao-musicas {
                margin-top:
                    42px;

                padding-top:
                    28px;
            }

            .titulo-musicas {
                margin-bottom:
                    19px;
            }

            .icone-musica {
                width:
                    38px;

                height:
                    38px;

                font-size:
                    20px;

                margin-bottom:
                    9px;
            }

            .titulo-musicas h2 {
                font-size:
                    23px;
            }

            .titulo-musicas p {
                font-size:
                    12px;

                line-height:
                    1.4;

                padding:
                    0 8px;
            }

            .lista-musicas {
                gap:
                    10px;
            }

            .card-musica {
                padding:
                    14px;

                border-radius:
                    15px;
            }

            .card-musica h3 {
                font-size:
                    18px;
            }

            .artista {
                font-size:
                    12px;

                margin-bottom:
                    11px;
            }

            .tipo-musica {
                font-size:
                    9px;

                padding:
                    4px 8px;

                margin-bottom:
                    8px;
            }

            .spotify-player iframe {
                height:
                    152px;
            }

            .coracao {
                font-size:
                    15px;
            }

        }


        /*
        ============================================
        CELULARES MUITO PEQUENOS
        ============================================
        */

        @media (max-width: 340px) {

            .container {
                padding:
                    20px 9px;
            }

            .contador {
                gap:
                    7px;
            }

            .caixa {
                padding:
                    14px 4px;
            }

            .numero {
                font-size:
                    26px;
            }

            .botao-tempo {
                padding:
                    7px 9px;

                font-size:
                    10px;
            }

        }
        /* ============================================
   FOTOS
============================================ */

.secao-fotos {
    width: 100%;
    margin-top: 55px;
    padding-top: 32px;

    border-top:
        1px solid
        rgba(255, 145, 180, 0.10);
}

.titulo-fotos {
    margin-bottom: 22px;
}

.icone-foto {
    display: flex;
    justify-content: center;
    align-items: center;

    width: 42px;
    height: 42px;

    margin: 0 auto 10px;

    border-radius: 50%;

    font-size: 24px;

    color: #ffc1d2;

    background:
        rgba(255, 70, 125, 0.09);

    border:
        1px solid
        rgba(255, 145, 180, 0.14);
}

.titulo-fotos h2 {
    font-size:
        clamp(23px, 4vw, 31px);

    color: #ffd2df;

    margin-bottom: 6px;
}

.titulo-fotos p {
    font-size: 13px;

    color:
        rgba(255, 220, 230, 0.66);
}


/* GALERIA */

.galeria-fotos {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.foto-card {
    width: 100%;

    aspect-ratio: 1 / 1;

    overflow: hidden;

    border-radius: 16px;

    border:
        1px solid
        rgba(255, 150, 185, 0.12);

    background:
        rgba(255,255,255,0.03);

    box-shadow:
        0 8px 22px
        rgba(0,0,0,0.20);
}

.foto-card img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    transition:
        transform 0.35s ease;
}

.foto-card:hover img {
    transform:
        scale(1.04);
}


/* Foto vertical das alianças */

.foto-alta {
    grid-row:
        span 2;

    aspect-ratio:
        auto;

    min-height:
        420px;
}


/* Última foto ocupa largura inteira */

.foto-destaque {
    grid-column:
        1 / -1;

    aspect-ratio:
        16 / 9;
}


/* ============================================
   CELULAR
============================================ */

@media (max-width: 480px) {

    .secao-fotos {
        margin-top:
            42px;

        padding-top:
            28px;
    }

    .galeria-fotos {
        grid-template-columns:
            repeat(2, 1fr);

        gap:
            7px;
    }

    .foto-card {
        border-radius:
            12px;
    }

    .foto-alta {
        min-height:
            320px;
    }

    .foto-destaque {
        grid-column:
            1 / -1;
    }

}
/* ============================================
   BOTÃO PARA REVELAR AS FOTOS
============================================ */

.botao-revelar-fotos {
    border:
        1px solid
        rgba(255, 145, 180, 0.22);

    outline: none;

    padding:
        11px 18px;

    border-radius:
        999px;

    cursor: pointer;

    font-size: 13px;
    font-weight: bold;

    color: #ffd8e3;

    background:
        linear-gradient(
            145deg,
            rgba(255, 80, 135, 0.18),
            rgba(255, 255, 255, 0.04)
        );

    box-shadow:
        0 7px 20px
        rgba(0, 0, 0, 0.20);

    transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
}

.botao-revelar-fotos:hover {
    transform:
        translateY(-2px);

    background:
        linear-gradient(
            145deg,
            rgba(255, 80, 135, 0.27),
            rgba(255, 255, 255, 0.06)
        );

    box-shadow:
        0 10px 25px
        rgba(255, 40, 110, 0.10);
}


/* ============================================
   MOSTRAR / ESCONDER GALERIA
============================================ */

.galeria-fotos {
    margin-top: 22px;

    transition:
        opacity 0.4s ease,
        transform 0.4s ease;
}

.galeria-fotos.escondida {
    display: none;
}

.galeria-fotos.aparecendo {
    animation:
        aparecerGaleria 0.5s ease;
}

@keyframes aparecerGaleria {

    from {
        opacity: 0;

        transform:
            translateY(15px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* ============================================
   FOTOS CLICÁVEIS
============================================ */

.foto-card {
    cursor: pointer;
}

.foto-card img {
    cursor: zoom-in;
}


/* ============================================
   TELA CHEIA
============================================ */

.visualizador-foto {
    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 25px;

    background:
        rgba(0, 0, 0, 0.94);

    backdrop-filter:
        blur(8px);

    z-index: 99999;
}

.visualizador-foto.ativo {
    display: flex;

    animation:
        aparecerVisualizador
        0.25s ease;
}

@keyframes aparecerVisualizador {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* FOTO AMPLIADA */

.visualizador-foto img {
    display: block;

    max-width:
        95vw;

    max-height:
        90vh;

    width:
        auto;

    height:
        auto;

    object-fit:
        contain;

    border-radius:
        14px;

    box-shadow:
        0 15px 60px
        rgba(0, 0, 0, 0.65);
}


/* BOTÃO X */

.fechar-foto {
    position: absolute;

    top: 20px;
    right: 20px;

    width: 44px;
    height: 44px;

    display: flex;
    justify-content: center;
    align-items: center;

    border: none;

    border-radius:
        50%;

    cursor: pointer;

    font-size:
        21px;

    color: white;

    background:
        rgba(255, 255, 255, 0.12);

    border:
        1px solid
        rgba(255, 255, 255, 0.16);

    backdrop-filter:
        blur(10px);

    z-index:
        100000;

    transition:
        background 0.25s ease,
        transform 0.25s ease;
}

.fechar-foto:hover {
    background:
        rgba(255, 75, 125, 0.35);

    transform:
        scale(1.06);
}


/* ============================================
   CELULAR
============================================ */

@media (max-width: 480px) {

    .botao-revelar-fotos {
        padding:
            10px 15px;

        font-size:
            12px;
    }

    .visualizador-foto {
        padding:
            12px;
    }

    .visualizador-foto img {
        max-width:
            96vw;

        max-height:
            86vh;

        border-radius:
            10px;
    }

    .fechar-foto {
        top:
            12px;

        right:
            12px;

        width:
            40px;

        height:
            40px;

        font-size:
            19px;
    }

}
    </style>
</head>

>

    </main>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const valor1 =
                    document.getElementById("valor1");

                const valor2 =
                    document.getElementById("valor2");

                const valor3 =
                    document.getElementById("valor3");

                const valor4 =
                    document.getElementById("valor4");


                const texto1 =
                    document.getElementById("texto1");

                const texto2 =
                    document.getElementById("texto2");

                const texto3 =
                    document.getElementById("texto3");

                const texto4 =
                    document.getElementById("texto4");


                const botaoNormal =
                    document.getElementById(
                        "botaoNormal"
                    );

                const botaoSemanas =
                    document.getElementById(
                        "botaoSemanas"
                    );

                const botaoMeses =
                    document.getElementById(
                        "botaoMeses"
                    );


                const dataInicial =
                    new Date(
                        2026,
                        8,
                        6,
                        0,
                        0,
                        0
                    );


                let modoAtual =
                    "dias";


                function atualizarBotaoAtivo() {

                    botaoNormal.classList.remove("ativo");
                    botaoSemanas.classList.remove("ativo");
                    botaoMeses.classList.remove("ativo");


                    if (modoAtual === "dias") {
                        botaoNormal.classList.add("ativo");
                    }


                    if (modoAtual === "semanas") {
                        botaoSemanas.classList.add("ativo");
                    }


                    if (modoAtual === "meses") {
                        botaoMeses.classList.add("ativo");
                    }

                }


                function obterTempo() {

                    const agora =
                        new Date();


                    const diferenca =
                        agora.getTime()
                        -
                        dataInicial.getTime();


                    if (diferenca < 0) {

                        return {
                            dias: 0,
                            horas: 0,
                            minutos: 0,
                            segundos: 0
                        };

                    }


                    const totalSegundos =
                        Math.floor(
                            diferenca / 1000
                        );


                    return {

                        dias:
                            Math.floor(
                                totalSegundos
                                / 86400
                            ),

                        horas:
                            Math.floor(
                                (
                                    totalSegundos
                                    % 86400
                                )
                                / 3600
                            ),

                        minutos:
                            Math.floor(
                                (
                                    totalSegundos
                                    % 3600
                                )
                                / 60
                            ),

                        segundos:
                            totalSegundos
                            % 60

                    };

                }


                function atualizarContador() {

                    const tempo =
                        obterTempo();


                    if (modoAtual === "dias") {

                        valor1.textContent =
                            tempo.dias;

                        texto1.textContent =
                            tempo.dias === 1
                                ? "Dia"
                                : "Dias";


                        valor2.textContent =
                            String(
                                tempo.horas
                            ).padStart(2, "0");

                        texto2.textContent =
                            "Horas";


                        valor3.textContent =
                            String(
                                tempo.minutos
                            ).padStart(2, "0");

                        texto3.textContent =
                            "Minutos";


                        valor4.textContent =
                            String(
                                tempo.segundos
                            ).padStart(2, "0");

                        texto4.textContent =
                            "Segundos";

                    }


                    if (modoAtual === "semanas") {

                        const semanas =
                            Math.floor(
                                tempo.dias / 7
                            );


                        const diasRestantes =
                            tempo.dias % 7;


                        valor1.textContent =
                            semanas;

                        texto1.textContent =
                            semanas === 1
                                ? "Semana"
                                : "Semanas";


                        valor2.textContent =
                            diasRestantes;

                        texto2.textContent =
                            diasRestantes === 1
                                ? "Dia"
                                : "Dias";


                        valor3.textContent =
                            String(
                                tempo.horas
                            ).padStart(2, "0");

                        texto3.textContent =
                            "Horas";


                        valor4.textContent =
                            String(
                                tempo.minutos
                            ).padStart(2, "0");

                        texto4.textContent =
                            "Minutos";

                    }


                    if (modoAtual === "meses") {

                        const meses =
                            Math.floor(
                                tempo.dias / 30
                            );


                        const diasRestantes =
                            tempo.dias % 30;


                        valor1.textContent =
                            meses;

                        texto1.textContent =
                            meses === 1
                                ? "Mês"
                                : "Meses";


                        valor2.textContent =
                            diasRestantes;

                        texto2.textContent =
                            diasRestantes === 1
                                ? "Dia"
                                : "Dias";


                        valor3.textContent =
                            String(
                                tempo.horas
                            ).padStart(2, "0");

                        texto3.textContent =
                            "Horas";


                        valor4.textContent =
                            String(
                                tempo.minutos
                            ).padStart(2, "0");

                        texto4.textContent =
                            "Minutos";

                    }

                }


                botaoNormal.addEventListener(
                    "click",
                    function () {

                        modoAtual =
                            "dias";

                        atualizarBotaoAtivo();
                        atualizarContador();

                    }
                );


                botaoSemanas.addEventListener(
                    "click",
                    function () {

                        modoAtual =
                            "semanas";

                        atualizarBotaoAtivo();
                        atualizarContador();

                    }
                );


                botaoMeses.addEventListener(
                    "click",
                    function () {

                        const tempo =
                            obterTempo();


                        if (tempo.dias < 30) {
                            return;
                        }


                        modoAtual =
                            "meses";

                        atualizarBotaoAtivo();
                        atualizarContador();

                    }
                );


                atualizarContador();

                setInterval(
                    atualizarContador,
                    1000
                );


                /*
                ========================================
                CORAÇÕES
                ========================================
                */

                const areaCoracoes =
                    document.getElementById(
                        "coracoes"
                    );


                const quantidadeCoracoes =
                    window.innerWidth <= 480
                    ? 15
                    : 26;


                for (
                    let i = 0;
                    i < quantidadeCoracoes;
                    i++
                ) {

                    const coracao =
                        document.createElement(
                            "span"
                        );


                    coracao.classList.add(
                        "coracao"
                    );


                    coracao.innerHTML =
                        "♥";


                    coracao.style.left =
                        Math.random()
                        * 100
                        + "%";


                    coracao.style.fontSize =
                        (
                            Math.random()
                            * 14
                            + 10
                        )
                        + "px";


                    coracao.style.animationDuration =
                        (
                            Math.random()
                            * 10
                            + 13
                        )
                        + "s";


                    coracao.style.animationDelay =
                        (
                            Math.random()
                            * -18
                        )
                        + "s";


                    areaCoracoes.appendChild(
                        coracao
                    );

                }

            }
        );

        /*
========================================
GALERIA DE FOTOS
========================================
*/

const botaoRevelarFotos =
    document.getElementById(
        "botaoRevelarFotos"
    );

const galeriaFotos =
    document.getElementById(
        "galeriaFotos"
    );

const fotosGaleria =
    document.querySelectorAll(
        ".foto-galeria"
    );

const visualizadorFoto =
    document.getElementById(
        "visualizadorFoto"
    );

const fotoAmpliada =
    document.getElementById(
        "fotoAmpliada"
    );

const fecharFoto =
    document.getElementById(
        "fecharFoto"
    );


/*
----------------------------------------
MOSTRAR / ESCONDER FOTOS
----------------------------------------
*/

botaoRevelarFotos.addEventListener(
    "click",
    function () {

        const estaEscondida =
            galeriaFotos
                .classList
                .contains(
                    "escondida"
                );


        if (estaEscondida) {

            galeriaFotos
                .classList
                .remove(
                    "escondida"
                );

            galeriaFotos
                .classList
                .add(
                    "aparecendo"
                );

            botaoRevelarFotos
                .textContent =
                "Esconder nossas fotos ❤️";

        }

        else {

            galeriaFotos
                .classList
                .add(
                    "escondida"
                );

            galeriaFotos
                .classList
                .remove(
                    "aparecendo"
                );

            botaoRevelarFotos
                .textContent =
                "Ver nossas fotos ❤️";

        }

    }
);


/*
----------------------------------------
ABRIR FOTO EM TELA CHEIA
----------------------------------------
*/

fotosGaleria.forEach(
    function (foto) {

        foto.addEventListener(
            "click",
            function () {

                fotoAmpliada.src =
                    foto.src;

                fotoAmpliada.alt =
                    foto.alt;

                visualizadorFoto
                    .classList
                    .add(
                        "ativo"
                    );

                document.body.style.overflow =
                    "hidden";

            }
        );

    }
);


/*
----------------------------------------
FECHAR FOTO
----------------------------------------
*/

function fecharVisualizador() {

    visualizadorFoto
        .classList
        .remove(
            "ativo"
        );

    fotoAmpliada.src =
        "";

    document.body.style.overflow =
        "";

}


fecharFoto.addEventListener(
    "click",
    fecharVisualizador
);


/*
Clique fora da foto também fecha.
*/

visualizadorFoto.addEventListener(
    "click",
    function (evento) {

        if (
            evento.target ===
            visualizadorFoto
        ) {

            fecharVisualizador();

        }

    }
);


/*
ESC também fecha no computador.
*/

document.addEventListener(
    "keydown",
    function (evento) {

        if (
            evento.key ===
            "Escape"
        ) {

            fecharVisualizador();

        }

    }
);
    </script>
